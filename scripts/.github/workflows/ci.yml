name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        # actions/setup-python@v6
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q .

      - name: Verify standalone configuration
        env:
          ANTHROPIC_API_KEY: test-key
          MODEL_ID: test-model
        run: python -c "from utils.system import CONFIG_PATH, PROJECT_ROOT, WORKDIR; assert CONFIG_PATH == PROJECT_ROOT / 'config.yaml'; assert WORKDIR == PROJECT_ROOT"
