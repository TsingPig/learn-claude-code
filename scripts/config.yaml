show_thinking: true
show_tool_use: false

streaming:
  # enabled: true          # set true to stream response tokens live
  show_thinking: true     # show thinking chunks while streaming
  show_text: true         # show text chunks while streaming

paths:
  workspace: D:\--UnityProject\RunminG-Lab\learn-claude-code\scripts
permission:
  # off    - disables all permission checks, executes commands directly
  # strict - enables all gates including the most restrictive checks
  mode: 'off' 
context:
  show_usage: true
  window_tokens: 200_000

# ── Unity Agent (used by `python scripts/UnityCode.py`, ignored by InplusCode) ──
# The MCP URL can be overridden with the UNITY_MCP_URL environment variable.
# project_path is relative to the workspace above.
unity:
  enabled: true
  project_path: "unity/AgentSandbox"

  mcp:
    transport: "http"
    url: "http://127.0.0.1:8080/mcp"
    auto_connect: true
    timeout_seconds: 30
    reconnect_attempts: 1
    cli_fallback: false

  tools:
    prefix: "mcp__unity__" # 这个用于识别 Unity 工具的前缀
    allow_groups:
      - core
      - testing
      - materials
      - prefabs
    deny_tools: []

  permission:
    read_only: "allow"
    mutating: "allow"
    destructive: "ask"
    arbitrary_execution: "ask"
