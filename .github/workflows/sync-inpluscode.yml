name: Sync InplusCode mirror

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync-inpluscode.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-inpluscode
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'InplusLab-Agent/learn-claude-code'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build scripts-only history
        run: git subtree split --prefix=scripts --branch inpluscode-sync

      - name: Publish mirror
        env:
          GH_TOKEN: ${{ secrets.INPLUSCODE_SYNC_TOKEN }}
        run: |
          gh auth setup-git
          git push https://github.com/InplusLab-Agent/InplusCode.git inpluscode-sync:main
