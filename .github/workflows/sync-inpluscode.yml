name: Sync InplusCode mirror

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-inpluscode
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'InplusLab-Agent/learn-claude-code'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Configure mirror deploy key
        env:
          DEPLOY_KEY: ${{ secrets.INPLUSCODE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Build scripts-only history
        run: git subtree split --prefix=scripts --branch inpluscode-sync

      - name: Publish mirror
        run: git push git@github.com:InplusLab-Agent/InplusCode.git inpluscode-sync:main
